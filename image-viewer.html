<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Viewer | Calmaura</title>
    <meta name="description" content="Full screen image viewer for Calmaura app screenshots." />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a class="brand" href="index.html">
          <span class="brand-mark"><img src="assets/images/logos/logo.svg" alt="Calmaura logo" /></span>
          <span>Calmaura</span>
        </a>
        <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html#benefits">Benefits</a>
          <a href="index.html#features">Features</a>
          <a href="index.html#stories">Stories</a>
          <a href="blog/index.html">Blog</a>
          <a href="index.html#faq">FAQ</a>
          <a class="btn btn-small btn-outline" href="https://play.google.com/store/apps/details?id=com.calmaura.app" target="_blank" rel="noopener">Get the app</a>
        </nav>
      </div>
    </header>

    <main class="section image-viewer-page">
      <div class="container image-viewer-content">
        <div>
          <img id="viewerImage" class="viewer-image" src="assets/images/screenshots/home.jpg" alt="Screenshot detail view" />
        </div>
        <div class="viewer-panel">
          <div class="viewer-meta" id="viewerMeta">Screenshot</div>
          <h1 id="viewerTitle">Full Image Preview</h1>
          <p id="viewerCaption">View the screenshot in full detail.</p>
          <p id="viewerDetails">Tap the back button to return to the app overview.</p>
          <a class="btn btn-secondary viewer-back" href="index.html#screenshots">Back to home</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>© <span id="year"></span> Calmaura. All rights reserved.</p>
      </div>
    </footer>

    <script type="module" src="assets/js/app.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const src = params.get('src');
      const title = params.get('title');
      const caption = params.get('caption');
      const details = params.get('details');

      const imgEl = document.getElementById('viewerImage');
      const titleEl = document.getElementById('viewerTitle');
      const captionEl = document.getElementById('viewerCaption');
      const detailsEl = document.getElementById('viewerDetails');
      const metaEl = document.getElementById('viewerMeta');

      if (src) {
        imgEl.src = src;
      }
      if (title) {
        titleEl.textContent = decodeURIComponent(title);
      }
      if (caption) {
        captionEl.textContent = decodeURIComponent(caption);
      }
      if (details) {
        detailsEl.textContent = decodeURIComponent(details);
      }
      if (!src) {
        titleEl.textContent = 'Image not found';
        captionEl.textContent = 'No image source was provided.';
        detailsEl.textContent = 'Return to the screenshots section and select an image again.';
      }
    </script>
  </body>
</html>
